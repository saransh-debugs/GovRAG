[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "govrag"
version = "0.1.0"
description = "Multi-tenant RAG with chunk-level RBAC, PII tokenization, and fail-closed audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7,<3.9",
    "llama-index-core>=0.12",
    "fastembed>=0.4",
    "numpy>=1.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
govrag = "govrag.api.app:main"

[project.optional-dependencies]
vertex = [
    "google-genai>=1.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "hypothesis>=6",
    "httpx>=0.27",
    "faker>=30",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["govrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# A hung pool acquire or a lost NOTIFY should fail the test, not hang CI.
timeout = 120
markers = [
    "vertex: calls the real Vertex API (costs money, skipped by default)",
]
addopts = "-m 'not vertex'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"scripts/**" = ["S105", "S311"]
"eval/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "presidio_analyzer.*", "presidio_anonymizer.*", "fastembed.*", "spacy.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
